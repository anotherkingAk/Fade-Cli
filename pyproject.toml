[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fade-cli"
version = "1.1.0"
description = "Fade — local-first autonomous coding agent CLI"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = []

[project.scripts]
fade = "fade_cli.app:main"

[tool.setuptools.packages.find]
include = ["fade_cli*"]
